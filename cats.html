<div id="cat-cursor"></div>

<script>
  const catCursor = document.getElementById('cat-cursor');
  const catImgs = document.querySelectorAll('.cat-img');

  document.addEventListener('mousemove', (e) => {
    catCursor.style.left = e.clientX + 'px';
    catCursor.style.top = e.clientY + 'px';
  });

  catImgs.forEach(img => {
    img.addEventListener('mouseenter', () => {
      catCursor.textContent = img.dataset.name;
      catCursor.style.display = 'block';
    });
    img.addEventListener('mouseleave', () => {
      catCursor.style.display = 'none';
    });
  });
</script>
